previews:
  generation: automatic

projects:
  - name: dev
    environments:
      - name: Production
        services:
          - type: web
            name: arrival-protocol
            runtime: static
            repo: https://github.com/frnhr/ArrivalProtocol
            branch: main
            buildCommand: npm ci && npm run build
            staticPublishPath: dist
            autoDeployTrigger: commit
            previews:
              generation: automatic
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
